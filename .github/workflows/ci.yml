name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint extensions
    # macOS like the test job: scripts/verify-test-scheme.sh relies on the system awk and xmllint.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests lint only the extensions they touch and warn (P14) about shared files;
      # pushes lint every extension. Findings also go to the job summary for reviewers.
      - name: Lint extensions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            ./scripts/lint-extensions --changed-since "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY"
          else
            ./scripts/lint-extensions --summary "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            build_all: true
          - arch: x86_64
            runner: macos-26-intel
            build_all: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          ./scripts/run-xcodebuild --output - -- -version
          xcrun swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build tools
        run: brew install openssl@3 ripgrep

      - name: Disable certificate signing
        run: |
          printf '%s\n' \
            'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGNING_REQUIRED = NO' \
            'CODE_SIGN_IDENTITY = -' \
            'DEVELOPMENT_TEAM =' \
            > "$RUNNER_TEMP/ci-signing.xcconfig"
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$RUNNER_TEMP/ci-signing.xcconfig" \
            >> "$GITHUB_ENV"

      - name: Run extension tests
        run: make test

      - name: Build all extensions
        if: matrix.build_all
        run: make

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-${{ matrix.arch }}
          path: build/xcodebuild
          if-no-files-found: warn
          retention-days: 7
